databases:
  - name: leadsgen-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: leadsgen
    user: leadsgen

services:
  - type: web
    name: leadsgen-web
    runtime: node
    plan: free
    region: oregon
    rootDir: lead-gen
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadsgen-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PIPELINE_TIMEZONE
        value: America/New_York
      - key: ADMIN_NAME
        value: Admin
      - key: DATABLIST_API_KEY
        sync: false
      - key: DATABLIST_COLLECTION_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  - type: cron
    name: leadsgen-daily-pipeline
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    rootDir: lead-gen
    schedule: "0 9 * * *"
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx scripts/daily-pipeline.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadsgen-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PIPELINE_TIMEZONE
        value: America/New_York
      - key: ADMIN_NAME
        value: Admin
      - key: DATABLIST_API_KEY
        sync: false
      - key: DATABLIST_COLLECTION_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
